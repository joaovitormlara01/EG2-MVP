<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pontos — RotaClara</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/componentes.css" />
    <script type="module" src="/js/paginas/pontos.js"></script>
  </head>
  <body>
    <a class="link-pular" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
      <a class="marca" href="/inicio.html">RotaClara <small>Cada parada conta.</small></a>
      <div class="cabecalho-usuario">
        <span id="usuario-atual"></span>
        <button type="button" class="botao botao-secundario" id="botao-sair">Sair</button>
      </div>
      <nav class="navegacao" id="navegacao" aria-label="Principal"></nav>
    </header>

    <main class="conteudo" id="conteudo" tabindex="-1">
      <h1>Pontos</h1>
      <p>Endereços reutilizáveis nos roteiros. Alterar um ponto não muda o endereço guardado em roteiros já montados.</p>
      <div id="mensagem" class="alerta" role="alert" aria-live="assertive"></div>

      <section class="secao cartao" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Novo ponto</h2>
        <form id="form-cadastro" novalidate>
          <div class="grade-form">
          <div class="campo">
            <label for="nome">Nome (opcional)</label>
            <input id="nome" name="nome" type="text" maxlength="100" aria-describedby="nome-erro" />
            <span id="nome-erro" class="campo-erro"></span>
          </div>
          <div class="campo largura-total">
            <label for="endereco">Endereço</label>
            <input id="endereco" name="endereco" type="text" required maxlength="300" aria-describedby="endereco-erro" />
            <span id="endereco-erro" class="campo-erro"></span>
          </div>
          <div class="campo">
            <label for="latitude">Latitude</label>
            <input id="latitude" name="latitude" type="text" required inputmode="decimal" pattern="-?[0-9]{1,3}([.,][0-9]{1,6})?" aria-describedby="latitude-ajuda latitude-erro" />
            <span id="latitude-ajuda" class="campo-ajuda">Entre -90 e 90. Ex.: -19,916681</span>
            <span id="latitude-erro" class="campo-erro"></span>
          </div>
          <div class="campo">
            <label for="longitude">Longitude</label>
            <input id="longitude" name="longitude" type="text" required inputmode="decimal" pattern="-?[0-9]{1,3}([.,][0-9]{1,6})?" aria-describedby="longitude-ajuda longitude-erro" />
            <span id="longitude-ajuda" class="campo-ajuda">Entre -180 e 180. Ex.: -43,934493</span>
            <span id="longitude-erro" class="campo-erro"></span>
          </div>
          </div>
          <label class="campo-marcacao" id="campo-ativo" hidden>
            <input type="checkbox" name="ativo" /> Ativo (desmarque para inativar; o histórico é mantido)
          </label>
          <div class="acoes">
            <button type="submit" class="botao botao-primario">Cadastrar</button>
            <button type="button" class="botao botao-secundario" id="cancelar-edicao" hidden>Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="secao" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Cadastrados</h2>
        <div id="lista" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
